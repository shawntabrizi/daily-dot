[package]
name = "word-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "word-registry"
path = "src/word_registry.rs"

[dependencies]
alloy-core = { version = "0.8", default-features = false, features = ["sol-types"] }
pallet-revive-uapi = { version = "0.10", default-features = false }
picoalloc = { version = "5", default-features = false }
polkavm-derive = { version = "0.31.0" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
pvm_contract = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "d886ab2aa80ffdd0e66133320bcbb4921ff2fc8c" }
daily-on-dot-logic = { path = "../logic", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = false
